<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kylie Guentherman Illustration</title>

  <!--
    PLAYFUL PORTFOLIO HOMEPAGE
    Inspired by clean illustrator portfolio layouts:
    - white background
    - simple centered navigation
    - playful typography
    - artwork shown immediately
  -->

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;600;700&display=swap');

    :root {
      --background: #ffffff;
      --text: #1f1f1f;
      --soft-text: #6f6f6f;
      --line: #eeeeee;
      --accent: #f4a7b9;
      --accent-yellow: #f7d86b;
      --accent-blue: #9fd8ef;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "Nunito", Arial, sans-serif;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HEADER */

    .site-header {
      width: 100%;
      padding: 28px 24px 18px;
      background: white;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }

    .top-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
      margin-bottom: 22px;
      font-family: "Gaegu", "Comic Sans MS", cursive;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
    }

    .top-nav a {
      position: relative;
      padding: 2px 3px;
    }

    .top-nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 0;
      height: 3px;
      background: var(--accent-yellow);
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    .top-nav a:hover::after,
    .top-nav a:focus::after {
      width: 100%;
    }

    .site-title {
      margin: 0;
      font-family: "Gaegu", "Comic Sans MS", cursive;
      font-size: clamp(2.7rem, 8vw, 6.2rem);
      line-height: 0.9;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .site-subtitle {
      margin: 12px 0 0;
      font-size: 1rem;
      color: var(--soft-text);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* PAGE WRAPPER */

    main {
      max-width: 1220px;
      margin: 0 auto;
      padding: 28px 24px 70px;
    }

    /* FEATURED HERO ART */

    .featured-art {
      margin: 0 auto 28px;
    }
